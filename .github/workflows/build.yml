name: Compilar mod Roland

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.0'

      - name: Compilar
        run: gradle build

      - name: Guardar archivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: Roland-H-5x4
          path: build/libs/*.jar
